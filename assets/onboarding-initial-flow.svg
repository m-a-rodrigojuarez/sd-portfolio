<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 360" role="img" aria-labelledby="title desc">
  <title id="title">Initial onboarding process screens</title>
  <desc id="desc">Five mobile onboarding screens connected by arrows: create account, verify identity, fiscal data, insurance data, and upload documents.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0c1c35" flood-opacity="0.14"/>
    </filter>
    <style>
      .shell{fill:#fff;stroke:#07111f;stroke-width:5}
      .notch,.field{fill:#edf4ff}
      .muted{fill:#d8deea}
      .ink{fill:#07111f;font-family:Inter,Arial,sans-serif;font-weight:900}
      .small{fill:#526176;font-family:Inter,Arial,sans-serif;font-weight:800}
      .blue{fill:#0f6fff}
      .blue-stroke{fill:none;stroke:#6ba8ff;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .arrow{fill:#1f6feb;font-family:Inter,Arial,sans-serif;font-weight:950}
    </style>
  </defs>

  <g filter="url(#shadow)">
    <g transform="translate(4 12)">
      <rect class="shell" x="0" y="0" width="174" height="320" rx="18"/>
      <rect class="notch" x="70" y="14" width="34" height="5" rx="3"/>
      <text class="ink" x="20" y="58" font-size="16">Create your</text>
      <text class="ink" x="20" y="78" font-size="16">account</text>
      <rect class="field" x="20" y="108" width="134" height="24" rx="5"/>
      <rect class="field" x="20" y="146" width="134" height="24" rx="5"/>
      <rect class="field" x="20" y="184" width="134" height="24" rx="5"/>
      <rect class="blue" x="20" y="260" width="134" height="34" rx="6"/>
      <text fill="#fff" font-family="Inter,Arial,sans-serif" font-weight="900" x="57" y="282" font-size="13">Continue</text>
    </g>

    <text class="arrow" x="210" y="178" font-size="34">→</text>

    <g transform="translate(252 12)">
      <rect class="shell" x="0" y="0" width="174" height="320" rx="18"/>
      <rect class="notch" x="70" y="14" width="34" height="5" rx="3"/>
      <text class="ink" x="20" y="58" font-size="16">Verify your</text>
      <text class="ink" x="20" y="78" font-size="16">identity</text>
      <rect class="field" x="20" y="110" width="134" height="28" rx="5"/>
      <text class="small" x="36" y="129" font-size="12">INE</text>
      <rect class="field" x="20" y="154" width="134" height="28" rx="5"/>
      <text class="small" x="36" y="173" font-size="12">Take a photo</text>
      <rect class="field" x="50" y="204" width="74" height="62" rx="12"/>
      <path class="blue-stroke" d="M73 236h28M76 222h22l5 10v22H71v-22l5-10Z"/>
    </g>

    <text class="arrow" x="458" y="178" font-size="34">→</text>

    <g transform="translate(500 12)">
      <rect class="shell" x="0" y="0" width="174" height="320" rx="18"/>
      <rect class="notch" x="70" y="14" width="34" height="5" rx="3"/>
      <text class="ink" x="20" y="58" font-size="16">Fiscal data</text>
      <rect class="field" x="20" y="96" width="134" height="22" rx="5"/>
      <text class="small" x="30" y="111" font-size="11">CURP</text>
      <rect class="field" x="20" y="136" width="134" height="22" rx="5"/>
      <text class="small" x="30" y="151" font-size="11">RFC</text>
      <rect class="field" x="20" y="176" width="134" height="22" rx="5"/>
      <text class="small" x="30" y="191" font-size="11">Postal code</text>
      <rect class="field" x="20" y="216" width="134" height="22" rx="5"/>
      <rect class="field" x="20" y="256" width="134" height="22" rx="5"/>
    </g>

    <text class="arrow" x="706" y="178" font-size="34">→</text>

    <g transform="translate(748 12)">
      <rect class="shell" x="0" y="0" width="174" height="320" rx="18"/>
      <rect class="notch" x="70" y="14" width="34" height="5" rx="3"/>
      <text class="ink" x="20" y="58" font-size="16">Insurance</text>
      <text class="ink" x="20" y="78" font-size="16">data</text>
      <circle cx="87" cy="128" r="34" fill="#edf4ff"/>
      <path class="blue-stroke" d="M87 107v31M73 122h28"/>
      <rect class="field" x="20" y="190" width="134" height="22" rx="5"/>
      <rect class="field" x="20" y="230" width="134" height="22" rx="5"/>
      <rect class="field" x="20" y="270" width="134" height="22" rx="5"/>
    </g>

    <text class="arrow" x="954" y="178" font-size="34">→</text>

    <g transform="translate(996 12)">
      <rect class="shell" x="0" y="0" width="174" height="320" rx="18"/>
      <rect class="notch" x="70" y="14" width="34" height="5" rx="3"/>
      <text class="ink" x="20" y="58" font-size="16">Upload</text>
      <text class="ink" x="20" y="78" font-size="16">documents</text>
      <circle cx="87" cy="130" r="36" fill="#edf4ff"/>
      <path class="blue-stroke" d="M87 150V104M70 121l17-17 17 17"/>
      <rect class="field" x="20" y="206" width="134" height="24" rx="5"/>
      <rect class="field" x="20" y="248" width="134" height="24" rx="5"/>
    </g>
  </g>
</svg>
