<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Phase 2 complete profile</title>
  <desc id="desc">Phase 2 onboarding panel with a mobile registration screen and four benefits in one column.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0c1c35" flood-opacity="0.12"/>
    </filter>
    <style>
      .panel{fill:#fff;stroke:#dce8f7;stroke-width:2}
      .head{fill:#eef5ff}
      .shell{fill:#fff;stroke:#07111f;stroke-width:5}
      .notch,.field{fill:#edf4ff}
      .ink{fill:#07111f;font-family:Inter,Arial,sans-serif;font-weight:900}
      .muted{fill:#526176;font-family:Inter,Arial,sans-serif;font-weight:800}
      .blue{fill:#0f6fff}
      .blue-text{fill:#1f6feb;font-family:Inter,Arial,sans-serif;font-weight:900}
      .icon-bg{fill:#edf4ff}
      .icon-stroke{fill:none;stroke:#1f6feb;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
      .check-fill{fill:#19b985}
    </style>
  </defs>
  <rect class="panel" x="1" y="1" width="718" height="438" rx="18"/>
  <path class="head" d="M2 19C2 9.6 9.6 2 19 2H701C710.4 2 718 9.6 718 19V90H2V19Z"/>
  <circle cx="58" cy="45" r="32" fill="#0f67c8"/>
  <text x="58" y="58" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="900">2</text>
  <text class="blue-text" x="120" y="57" font-size="31">Phase 2 — Complete your profile</text>

  <g filter="url(#shadow)">
    <g transform="translate(52 104)">
      <rect class="shell" x="0" y="0" width="174" height="320" rx="18"/>
      <rect class="notch" x="70" y="14" width="34" height="5" rx="3"/>
      <text class="ink" x="20" y="74" font-size="18">Complete your</text>
      <text class="ink" x="20" y="97" font-size="18">registration</text>
      <g font-family="Inter,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#526176">
        <g transform="translate(22 132)">
          <circle class="check-fill" cx="9" cy="9" r="9"/>
          <path d="M5 9L8 12L14 6" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="30" y="13">Tax information</text>
          <rect class="field" x="30" y="24" width="118" height="5" rx="2"/>
        </g>
        <g transform="translate(22 172)">
          <circle class="check-fill" cx="9" cy="9" r="9"/>
          <path d="M5 9L8 12L14 6" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="30" y="13">Insurance</text>
          <rect class="field" x="30" y="24" width="118" height="5" rx="2"/>
        </g>
        <g transform="translate(22 212)">
          <circle class="check-fill" cx="9" cy="9" r="9"/>
          <path d="M5 9L8 12L14 6" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="30" y="13">Beneficiaries</text>
          <rect class="field" x="30" y="24" width="118" height="5" rx="2"/>
        </g>
      </g>
      <rect class="blue" x="20" y="260" width="134" height="34" rx="6"/>
      <text x="87" y="282" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="900">Continue</text>
    </g>
  </g>

  <g transform="translate(300 113)" font-family="Inter,Arial,sans-serif">
    <g>
      <circle class="icon-bg" cx="28" cy="28" r="28"/>
      <rect x="17" y="20" width="23" height="23" rx="2" class="icon-stroke"/>
      <path d="M21 15V25M36 15V25M17 29H40" class="icon-stroke"/>
      <text class="muted" x="74" y="23" font-size="23">30 days</text>
      <text class="muted" x="74" y="50" font-size="23">to complete it</text>
    </g>
    <g transform="translate(0 78)">
      <circle class="icon-bg" cx="28" cy="28" r="28"/>
      <path d="M16 40V28H25V40M30 40V18H39V40M12 40H44" class="icon-stroke"/>
      <text class="muted" x="74" y="36" font-size="22">Higher-value orders</text>
    </g>
    <g transform="translate(0 156)">
      <circle class="icon-bg" cx="28" cy="28" r="28"/>
      <path d="M28 47S42 34 42 22C42 14 36 8 28 8S14 14 14 22C14 34 28 47 28 47Z" class="icon-stroke"/>
      <circle cx="28" cy="22" r="5" class="icon-stroke"/>
      <text class="muted" x="74" y="36" font-size="22">Shorter distances</text>
    </g>
    <g transform="translate(0 234)">
      <circle class="icon-bg" cx="28" cy="28" r="28"/>
      <path d="M14 24L28 15L42 24L28 33L14 24Z" class="icon-stroke"/>
      <path d="M19 30V38C24 44 32 44 37 38V30" class="icon-stroke"/>
      <text class="muted" x="74" y="22" font-size="22">Tax support</text>
      <text class="muted" x="74" y="48" font-size="22">SAT/e.firma help</text>
    </g>
  </g>
</svg>
